name: Tayoca static quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tayoca-static-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate deployable files, sitemap, robots, and secret hygiene
        run: python3 scripts/validate_static_site.py
