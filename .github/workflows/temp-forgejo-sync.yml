name: TEMP Forgejo Canonical Sync

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out mirror
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify expected mirror base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b6a5770efe3353907dae8f494ba3ca91a62abbe0"

      - name: Fetch canonical Forgejo files
        shell: bash
        env:
          MIRROR_URL: https://n8n.tca-infraforge.site/webhook/tayoca/internal/mirror-file-5c2b963ba9724e2089809e8377d7fd43
        run: |
          set -euo pipefail
          cat > /tmp/tayoca-mirror-paths.txt <<'PATHS'
          docs/claims-register.yaml
          docs/evidence-policy.md
          docs/positioning.md
          docs/repository-source-of-truth.yaml
          scripts/validate_static_site.py
          vercel.json
          public/_redirects
          public/about.html
          public/assessments.html
          public/growth-os.js
          public/index.html
          public/operator-brief.html
          public/products.html
          public/results.html
          public/revenue-events.js
          public/reviews.html
          public/services.html
          public/sitemap.xml
          public/sivanta.html
          public/trust.html
          public/assets/css/site-shell.css
          public/segments/ai-enabled-engineering.html
          public/segments/growth-stage-technology.html
          public/segments/regulated-operations.html
          public/blog/ai-automation-career-roadmap.html
          public/blog/cka-practice-beyond-memorization.html
          public/blog/cloud-cost-optimization-playbook.html
          public/blog/devops-incident-response-runbook.html
          public/blog/etcd-backup-restore-lab.html
          public/blog/gitops-beyond-hello-world.html
          public/blog/how-we-saved-216k-aws.html
          public/blog/how-we-saved-216k-on-aws-in-90-days.html
          public/blog/index.html
          public/blog/kubernetes-incident-response-practice.html
          public/blog/kubernetes-interview-scenarios.html
          public/blog/kubernetes-production-checklist.html
          public/blog/kubernetes-production-readiness-checklist-for-2026.html
          public/blog/kubernetes-troubleshooting-labs.html
          public/blog/n8n-mcp-kubernetes.html
          public/products/ai-automation-career-playbook.html
          public/products/aws-cost-optimization-playbook.html
          public/products/build-break-fix-devops-lab-pack.html
          public/products/devops-incident-runbook-template.html
          public/products/gitops-field-guide.html
          public/products/kubernetes-operators-workbook.html
          public/products/kubernetes-production-readiness-checklist.html
          public/products/n8n-mcp-kubernetes-teaching-pack.html
          PATHS
          test "$(wc -l < /tmp/tayoca-mirror-paths.txt | tr -d ' ')" = "47"
          while IFS= read -r p; do
            mkdir -p "$(dirname "$p")"
            tmp_json="$(mktemp)"
            curl -fsSLG --retry 3 --retry-delay 2 \
              --data-urlencode "path=$p" \
              -H 'User-Agent: Tayoca-GitHub-Mirror/1.0' \
              "$MIRROR_URL" -o "$tmp_json"
            test "$(jq -r '.path' "$tmp_json")" = "$p"
            jq -er '.sha | strings | select(length == 40)' "$tmp_json" >/dev/null
            jq -r '.content' "$tmp_json" | base64 --decode > "$p"
            rm -f "$tmp_json"
          done < /tmp/tayoca-mirror-paths.txt

      - name: Verify canonical repository tree
        shell: bash
        run: |
          set -euo pipefail
          git add docs scripts vercel.json public
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(sort /tmp/tayoca-mirror-paths.txt)"
          test "$actual" = "$expected"
          git rm --cached -f .github/workflows/temp-forgejo-sync.yml
          tree="$(git write-tree)"
          test "$tree" = "c0579923ff6f24853ecd4b198055fea1a14f7492"
          git reset HEAD -- .github/workflows/temp-forgejo-sync.yml
          git add docs scripts vercel.json public
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "47"

      - name: Commit canonical mirror state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tayoca Mirror Sync"
          git config user.email "tayoca-mirror@users.noreply.github.com"
          git commit -m "chore: sync canonical Forgejo state through Stage 6"
          git push origin HEAD:main
