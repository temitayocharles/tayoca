name: TEMP Tayoca Book Access Edge Probe
on:
  push:
    branches: [reader-pass-v3]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public endpoints without credentials
        run: |
          set -euo pipefail
          echo '=== n8n health ==='
          curl -sS -D /tmp/h1 -o /tmp/b1 -w 'status=%{http_code}\n' https://n8n.tayoca.com/healthz || true
          cat /tmp/h1 || true
          head -c 500 /tmp/b1 || true
          echo
          echo '=== direct n8n invalid token ==='
          curl -sS -D /tmp/h2 -o /tmp/b2 -w 'status=%{http_code}\n' 'https://n8n.tayoca.com/webhook/tayoca/books/access?token=ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff' || true
          cat /tmp/h2 || true
          head -c 500 /tmp/b2 || true
          echo
          echo '=== tayoca public route invalid token ==='
          curl -sS -D /tmp/h3 -o /tmp/b3 -w 'status=%{http_code}\n' 'https://tayoca.com/access/book?token=ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff' || true
          cat /tmp/h3 || true
          head -c 500 /tmp/b3 || true
