<script>
// Robust CSV parser with fixed $1 bug (avoid literal $1 in replace)
function parseCSV(csv) {
 const lines = csv.trim().split('\n');
 const headers = lines[0].split(',').map(h => h.trim());
 const result = [];
 for (let i = 1; i < lines.length; i++) {
 const raw = lines[i];
 // trim surrounding quotes if any
 const values = raw.split(',').map(v => v.trim().replace(/^".*"$/, m => m.slice(1,-1)) );
 const obj = {};
 headers.forEach((h, idx) => obj[h] = values[idx] ?? '');
 result.push(obj);
 }
 return result;
}

// Fetch CSV and render products
async function loadProducts() {
 try {
 const r = await fetch('products-feed.csv');
 if (!r.ok) throw new Error(`CSV fetch ${r.status}`);
 const csv = await r.text();
 const products = parseCSV(csv);
 const c = document.getElementById('productsContainer'); c.innerHTML = '';

 products.forEach(p => {
 const card = document.createElement('div');
 card.className = 'product-card';
 card.innerHTML = `<h2>${p.name || ''}</h2><div class="price">$${p.price || ''}</div><p>${p.description || ''}</p><a href="${p.url || '#'}" target="_blank" rel="noopener" class="cta-button">Buy Now</a>`;
 c.appendChild(card);
 });
 } catch (e) {
 console.error('CSV load error:', e);
 document.getElementById('productsContainer').innerHTML = '<p style="color:#f87171">Could not load products right now.</p>';
 }
}

 document.addEventListener('DOMContentLoaded', loadProducts);
</script>
