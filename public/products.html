      <script>
        (function() {
          var endpoint = 'https://v7mhrspk.function2.insforge.app/analytics-event';
          var domain = 'tayoca.com';
          function sendEvent(name, props) {
            var data = {
              domain: domain,
              name: name,
              url: window.location.href,
              path: window.location.pathname,
              referrer: document.referrer || null,
              screen_width: window.screen.width,
              screen_height: window.screen.height,
              props: props || {}
            };
            navigator.sendBeacon && navigator.sendBeacon(endpoint, JSON.stringify(data)) ||
              fetch(endpoint, { method: 'POST', body: JSON.stringify(data), keepalive: true });
          }
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() { sendEvent('pageview'); });
          } else {
            sendEvent('pageview');
          }
          window.tayocaAnalytics = { sendEvent: sendEvent };

    <style>
        :root {

<body>
    <h1>Our Products</h1>
    <div class="products-grid" id="productsContainer">
        <!-- Product cards will be injected here -->
    </div>

    <script>
        // Function to parse CSV string into array of objects
        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const headers = lines[0].split(',').map(header => header.trim());
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',').map(value => {
                    // Remove quotes if present
                    return value.replace(/^"(.*)"$/, '$1').trim();
                });
                const obj = {};
                headers.forEach((header, index) => {
                    obj[header] = values[index];
                });
                result.push(obj);
            }
            return result;
        }

        // Fetch the CSV and render products
        async function loadProducts() {
            try {
                const response = await fetch('products-feed.csv');
                if (!response.ok) {
                    throw new Error(`Failed to fetch CSV: ${response.status}`);
                }
                const csvText = await response.text();
                const products = parseCSV(csvText);
                const container = document.getElementById('productsContainer');
                container.innerHTML = ''; // Clear loading state

                products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <h2>${product.name}</h2>
                        <div class="price">$${product.price}</div>
                        <p>${product.description}</p>
                        <a href="${product.url}" target="_blank" rel="noopener" class="cta-button">Buy Now</a>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading products:', error);
                document.getElementById('productsContainer').innerHTML = '<p>Error loading products. Please try again later.</p>';
            }
        }

        // Load products on page load
        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
