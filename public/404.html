<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Page not found | Tayoca</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #111111;
      color: #f4f4f4;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(680px, 100%);
      padding: clamp(32px, 7vw, 72px);
      border: 1px solid #363636;
      border-radius: 24px;
      background: #1b1b1b;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }
    .code {
      margin: 0 0 12px;
      color: #ff7a1a;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(2.25rem, 8vw, 4.75rem); line-height: 0.98; }
    p { margin: 22px 0 30px; color: #c9c9c9; font-size: 1.08rem; line-height: 1.65; }
    a {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 0 22px;
      border-radius: 999px;
      background: #ff7a1a;
      color: #111111;
      font-weight: 800;
      text-decoration: none;
    }
    a:focus-visible { outline: 3px solid #ffffff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>This page is not here.</h1>
    <p>The address may have changed, or the page may no longer exist. Return to Tayoca and continue from the main site.</p>
    <a href="/">Return to Tayoca</a>
  </main>
</body>
</html>
