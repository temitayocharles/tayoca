name: Structured data governance
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: tayoca-structured-data-governance-${{ forgejo.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate Arena structured data governance
    runs-on: forgejo-general
    timeout-minutes: 10
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
      - name: Validate structured data
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/validate_arena_authoritative.py
          python3 scripts/validate_arena_authoritative.py --scope structured
