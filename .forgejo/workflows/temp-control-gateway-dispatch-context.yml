name: TEMP Control gateway dispatch context

on:
  workflow_dispatch:
    inputs:
      expected:
        description: Expected ACTIVE Vercel account count class
        required: true
        type: string

permissions:
  contents: read

jobs:
  context:
    runs-on: forgejo-general
    timeout-minutes: 3
    env:
      EXPECTED: ${{ inputs.expected }}
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
    steps:
      - name: Discover repo-scoped ACTIVE Vercel accounts without emitting IDs
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test -n "${COMPOSIO_API_KEY:-}"
          out=/tmp/composio-accounts.json
          api_key_header="$(printf '%s: %s' 'x-api-key' "$COMPOSIO_API_KEY")"
          code="$(curl --silent --show-error --max-time 30 -G -o "$out" -w '%{http_code}' \
            -H "$api_key_header" \
            --data-urlencode 'toolkit_slugs=vercel' \
            --data-urlencode 'statuses=ACTIVE' \
            --data-urlencode 'limit=20' \
            'https://backend.composio.dev/api/v3.1/connected_accounts')"
          unset COMPOSIO_API_KEY api_key_header
          test "$code" = 200
          count="$(python3 - "$out" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          items=d.get('items') or []
          print(sum(1 for x in items if isinstance(x,dict) and str(x.get('status','')).upper()=='ACTIVE' and str(((x.get('toolkit') or {}).get('slug') or '')).lower()=='vercel'))
          PY
          )"
          rm -f "$out"
          case "$EXPECTED" in
            zero) test "$count" -eq 0 ;;
            one) test "$count" -eq 1 ;;
            multiple) test "$count" -gt 1 ;;
            *) exit 2 ;;
          esac
          echo "CONTROL_GATEWAY_COMPOSIO_VERCEL_ACCOUNTS=$EXPECTED"
