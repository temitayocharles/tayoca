name: TEMP Control gateway dispatch context

on:
  workflow_dispatch:
    inputs:
      expected:
        description: Expected bounded Composio HTTP class
        required: true
        type: string

permissions:
  contents: read

jobs:
  context:
    runs-on: forgejo-general
    timeout-minutes: 3
    env:
      EXPECTED: ${{ inputs.expected }}
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      VERCEL_CONNECTED_ACCOUNT_ID: vercel_carte-verpa
      VERCEL_PROJECT_ID: prj_boudZhZAPKBiUbNttAgSslPyaNDu
    steps:
      - name: Classify exact non-decrypting Composio Vercel metadata route
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          test -n "${COMPOSIO_API_KEY:-}"
          body="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
            "connected_account_id": os.environ["VERCEL_CONNECTED_ACCOUNT_ID"],
            "version": "latest",
            "arguments": {
              "idOrName": os.environ["VERCEL_PROJECT_ID"],
              "decrypt": "false"
            }
          }, separators=(',',':')))
          PY
          )"
          api_key_header="$(printf '%s: %s' 'x-api-key' "$COMPOSIO_API_KEY")"
          code="$(curl --silent --show-error --max-time 30 -o /tmp/composio-check.json -w '%{http_code}' \
            -H "$api_key_header" \
            -H 'Content-Type: application/json' \
            --data "$body" \
            'https://backend.composio.dev/api/v3/tools/execute/VERCEL_FILTER_PROJECT_ENVS')"
          rm -f /tmp/composio-check.json
          unset COMPOSIO_API_KEY api_key_header body
          case "$EXPECTED" in
            200|400|401|403|404|409|422|429)
              test "$code" = "$EXPECTED"
              ;;
            5xx)
              case "$code" in 5??) ;; *) exit 1 ;; esac
              ;;
            other)
              case "$code" in 200|400|401|403|404|409|422|429|5??) exit 1 ;; *) ;; esac
              ;;
            *) exit 2 ;;
          esac
          echo "CONTROL_GATEWAY_COMPOSIO_HTTP=$EXPECTED"
