name: Tayoca content architecture
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: tayoca-content-architecture-${{ forgejo.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate Arena content architecture
    runs-on: forgejo-general
    timeout-minutes: 10
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
      - name: Validate Arena-authoritative content architecture
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/validate_arena_authoritative.py
          python3 scripts/validate_arena_authoritative.py --scope content
