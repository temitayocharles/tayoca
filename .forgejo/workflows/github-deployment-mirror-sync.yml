name: Tayoca Forgejo to GitHub deployment mirror

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "11 * * * *"

permissions:
  contents: read

concurrency:
  group: tayoca-forgejo-github-deployment-mirror
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile deployment mirror
    runs-on: forgejo-general
    timeout-minutes: 20
    steps:
      - name: Check out canonical Forgejo revision
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Verify runtime contract
        shell: bash
        run: |
          set -euo pipefail
          command -v git >/dev/null
          command -v curl >/dev/null
          command -v openssl >/dev/null
          command -v python3 >/dev/null
          python3 -m py_compile scripts/sync_github_deployment_mirror.py
          current_head="$(git rev-parse HEAD)"
          git fetch --quiet --depth 1 origin refs/heads/main
          current_main="$(git rev-parse FETCH_HEAD)"
          if [ "$current_head" != "$current_main" ]; then
            echo "Checked-out revision is not current Forgejo main; refusing mirror mutation" >&2
            exit 1
          fi

      - name: Mint short-lived GitHub App token and reconcile mirror
        shell: bash
        env:
          CANONICAL_GITHUB_APP_ID: ${{ secrets.CANONICAL_GITHUB_APP_ID }}
          CANONICAL_GITHUB_APP_PRIVATE_KEY: ${{ secrets.CANONICAL_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_MIRROR_REPOSITORY: temitayocharles/tayoca
        run: |
          set -euo pipefail
          umask 077
          test -n "$CANONICAL_GITHUB_APP_ID"
          test -n "$CANONICAL_GITHUB_APP_PRIVATE_KEY"
          case "$CANONICAL_GITHUB_APP_ID" in
            *[!0-9]*) echo "GitHub App ID must be numeric" >&2; exit 1 ;;
          esac

          canonical_root="$PWD"
          canonical_sha="$(git rev-parse HEAD)"
          tmp="$(mktemp -d)"
          cleanup() {
            unset GITHUB_APP_TOKEN CANONICAL_GITHUB_APP_PRIVATE_KEY
            rm -rf "$tmp"
          }
          trap cleanup EXIT

          key_file="$tmp/github-app.pem"
          printf '%s\n' "$CANONICAL_GITHUB_APP_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"

          b64url() {
            openssl base64 -A | tr '+/' '-_' | tr -d '='
          }

          now="$(date +%s)"
          iat="$((now - 60))"
          exp="$((now + 540))"
          header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)"
          payload="$(printf '{"iat":%s,"exp":%s,"iss":%s}' "$iat" "$exp" "$CANONICAL_GITHUB_APP_ID" | b64url)"
          unsigned="$header.$payload"
          signature="$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key_file" -binary | b64url)"
          app_jwt="$unsigned.$signature"

          installation_json="$(curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $app_jwt" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_MIRROR_REPOSITORY/installation")"
          installation_id="$(printf '%s' "$installation_json" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("id") or "")')"
          test -n "$installation_id"

          token_json="$(curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $app_jwt" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/app/installations/$installation_id/access_tokens")"
          GITHUB_APP_TOKEN="$(printf '%s' "$token_json" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("token") or "")')"
          contents_permission="$(printf '%s' "$token_json" | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("permissions") or {}).get("contents") or "")')"
          unset token_json app_jwt signature unsigned payload header installation_json
          test -n "$GITHUB_APP_TOKEN"
          if [ "$contents_permission" != "write" ]; then
            echo "GitHub App token lacks contents:write; refusing mirror mutation" >&2
            exit 1
          fi
          export GITHUB_APP_TOKEN

          repo_push="$(curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_APP_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_MIRROR_REPOSITORY" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(str(bool((d.get("permissions") or {}).get("push"))).lower())')"
          if [ "$repo_push" != "true" ]; then
            echo "GitHub App installation cannot push to target repository; refusing mirror mutation" >&2
            exit 1
          fi

          askpass="$tmp/askpass.sh"
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *) printf '%s\n' "$GITHUB_APP_TOKEN" ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0

          mirror="$tmp/mirror"
          git clone --quiet --depth 1 --branch main "https://github.com/$GITHUB_MIRROR_REPOSITORY.git" "$mirror"
          github_head="$(git -C "$mirror" rev-parse HEAD)"

          set +e
          python3 scripts/sync_github_deployment_mirror.py \
            --canonical-root "$canonical_root" \
            --mirror-root "$mirror" \
            --mode check
          parity_status="$?"
          set -e
          if [ "$parity_status" -eq 0 ]; then
            echo "GitHub deployment mirror already matches canonical Forgejo bytes; no commit created."
            exit 0
          fi
          if [ "$parity_status" -ne 1 ]; then
            echo "Mirror preflight failed unexpectedly; refusing mutation" >&2
            exit "$parity_status"
          fi

          python3 scripts/sync_github_deployment_mirror.py \
            --canonical-root "$canonical_root" \
            --mirror-root "$mirror" \
            --mode sync

          git -C "$mirror" add -A -- public vercel.json
          if git -C "$mirror" diff --cached --quiet; then
            echo "Manifest differed but Git index is unchanged; refusing ambiguous state" >&2
            exit 1
          fi

          git -C "$mirror" config user.name "Tayoca Forgejo Mirror"
          git -C "$mirror" config user.email "tayoca-mirror@users.noreply.forgejo.tca-infraforge.site"
          git -C "$mirror" commit -m "mirror(forgejo): sync canonical deployment tree" \
            -m "Forgejo-Canonical: $canonical_sha" \
            -m "GitHub-Prestate: $github_head"

          remote_before="$(git -C "$mirror" ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$remote_before" != "$github_head" ]; then
            echo "GitHub main advanced during reconciliation; refusing race" >&2
            exit 1
          fi

          backup_tag="forgejo-mirror-backup-$(date -u +%Y%m%dT%H%M%SZ)-${github_head:0:12}"
          git -C "$mirror" tag "$backup_tag" "$github_head"
          git -C "$mirror" push --quiet origin "refs/tags/$backup_tag"
          git -C "$mirror" push --quiet origin HEAD:refs/heads/main

          git -C "$mirror" fetch --quiet --depth 1 origin main
          git -C "$mirror" reset --hard --quiet FETCH_HEAD
          python3 scripts/sync_github_deployment_mirror.py \
            --canonical-root "$canonical_root" \
            --mirror-root "$mirror" \
            --mode check

          github_after="$(git -C "$mirror" rev-parse HEAD)"
          echo "Mirror reconciliation complete: canonical=$canonical_sha github=$github_after rollback_tag=$backup_tag"
