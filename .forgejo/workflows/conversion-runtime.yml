name: Tayoca conversion runtime
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: tayoca-conversion-runtime-${{ forgejo.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: Validate Arena conversion/runtime contract
    runs-on: forgejo-general
    timeout-minutes: 10
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
      - name: Validate governed conversion surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/validate_arena_authoritative.py
          python3 scripts/scan_retired_hosts.py
          python3 scripts/validate_arena_authoritative.py --scope conversion
