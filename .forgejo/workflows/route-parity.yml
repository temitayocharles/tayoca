name: Tayoca route parity

on:
  push:
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: tayoca-route-parity-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate deployment route parity
    runs-on: forgejo-general
    timeout-minutes: 10
    steps:
      - name: Check out Tayoca
        uses: https://data.forgejo.org/actions/checkout@v6

      - name: Validate canonical routing surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/validate_route_parity.py
          python3 scripts/validate_route_parity.py
