name: Tayoca control gateway secret bootstrap

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Non-secret idempotency key
        required: true
        type: string

enable-openid-connect: true

permissions:
  contents: read

concurrency:
  group: tayoca-control-gateway-secret-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: forgejo.ref == 'refs/heads/main'
    runs-on: forgejo-general
    timeout-minutes: 10
    env:
      VAULT_ADDR: https://vault.tca-infraforge.site
      VAULT_ROLE: tayoca-control-gateway-bootstrap
      VAULT_AUDIENCE: vault://tayoca/control-gateway-bootstrap
      VAULT_PATH: temitayo/staging/platform-tools/n8n/tayoca-control-gateway
      REQUEST_ID: ${{ inputs.request_id }}
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      VERCEL_CONNECTED_ACCOUNT_ID: vercel_carte-verpa
      VERCEL_PROJECT_ID: prj_boudZhZAPKBiUbNttAgSslPyaNDu
    steps:
      - name: Generate candidate and stage it in Vault only
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          case "$REQUEST_ID" in
            *[!a-zA-Z0-9._-]*|'') echo 'Invalid request_id' >&2; exit 1 ;;
          esac
          if [ "${#REQUEST_ID}" -lt 12 ] || [ "${#REQUEST_ID}" -gt 80 ]; then
            echo 'request_id length out of bounds' >&2
            exit 1
          fi
          test -n "$COMPOSIO_API_KEY"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"

          tmp="$(mktemp -d)"
          cleanup() {
            unset FORGEJO_ID_TOKEN VAULT_TOKEN GATEWAY_TOKEN COMPOSIO_API_KEY
            rm -rf "$tmp"
          }
          trap cleanup EXIT

          case "$ACTIONS_ID_TOKEN_REQUEST_URL" in
            https://forgejo.tca-infraforge.site/*) ;;
            *) echo 'Unexpected Forgejo OIDC request origin' >&2; exit 1 ;;
          esac
          oidc_path="${ACTIONS_ID_TOKEN_REQUEST_URL#https://forgejo.tca-infraforge.site}"
          oidc_response="$(curl --fail --silent --show-error --max-time 30 \
            -H 'Host: forgejo.tca-infraforge.site' \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "http://forgejo-http.forgejo.svc.cluster.local:3000${oidc_path}&audience=$VAULT_AUDIENCE")"
          FORGEJO_ID_TOKEN="$(printf '%s' "$oidc_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          test -n "$FORGEJO_ID_TOKEN"
          echo "::add-mask::$FORGEJO_ID_TOKEN"
          export FORGEJO_ID_TOKEN
          unset oidc_response oidc_path

          vault_login_body="$(python3 - <<'PY'
          import json, os
          print(json.dumps({"role": os.environ["VAULT_ROLE"], "jwt": os.environ["FORGEJO_ID_TOKEN"]}))
          PY
          )"
          vault_login_response="$(curl --fail --silent --show-error --max-time 30 \
            -H 'Content-Type: application/json' --data "$vault_login_body" \
            "$VAULT_ADDR/v1/auth/forgejo-actions/login")"
          VAULT_TOKEN="$(printf '%s' "$vault_login_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["auth"]["client_token"])')"
          test -n "$VAULT_TOKEN"
          echo "::add-mask::$VAULT_TOKEN"
          export VAULT_TOKEN
          unset vault_login_body vault_login_response FORGEJO_ID_TOKEN

          existing="$tmp/existing.json"
          existing_status="$(curl --silent --show-error --max-time 30 -o "$existing" -w '%{http_code}' \
            -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/kv/data/$VAULT_PATH")"
          if [ "$existing_status" = 200 ]; then
            python3 - "$existing" "$REQUEST_ID" <<'PY'
          import json, sys
          body=json.load(open(sys.argv[1]))
          values=((body.get('data') or {}).get('data') or {})
          if values.get('request_id') != sys.argv[2]:
              raise SystemExit('existing staged token belongs to another request_id; refusing replacement')
          if values.get('state') not in ('staged','vercel_updated','active'):
              raise SystemExit('unexpected staged-token state')
          if not values.get('TAYOCA_CONTROL_GATEWAY_TOKEN'):
              raise SystemExit('existing staged record missing gateway token')
          PY
            echo 'Existing request_id is already staged; no credential value was emitted.'
            exit 0
          elif [ "$existing_status" != 404 ]; then
            echo "Unexpected Vault read status: $existing_status" >&2
            exit 1
          fi

          GATEWAY_TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          test -n "$GATEWAY_TOKEN"
          echo "::add-mask::$GATEWAY_TOKEN"
          export GATEWAY_TOKEN
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export created_at
          python3 - "$tmp/write.json" <<'PY'
          import json, os, sys
          payload={"data":{
              "TAYOCA_CONTROL_GATEWAY_TOKEN": os.environ["GATEWAY_TOKEN"],
              "request_id": os.environ["REQUEST_ID"],
              "state": "staged",
              "created_at": os.environ["created_at"],
          }}
          with open(sys.argv[1], 'w') as f:
              json.dump(payload, f, separators=(',',':'))
          PY
          curl --fail --silent --show-error --max-time 30 \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "@$tmp/write.json" \
            "$VAULT_ADDR/v1/kv/data/$VAULT_PATH" >/dev/null
          sha="$(printf '%s' "$GATEWAY_TOKEN" | sha256sum | awk '{print $1}')"
          unset GATEWAY_TOKEN VAULT_TOKEN
          echo "Gateway credential staged in dedicated Vault path; request_id=$REQUEST_ID; sha256=$sha; vercel_changed=no; runtime_changed=no."

      - name: Verify Composio Vercel bridge without decrypting or changing values
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          test -n "$COMPOSIO_API_KEY"
          body="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
            "connected_account_id": os.environ["VERCEL_CONNECTED_ACCOUNT_ID"],
            "version": "latest",
            "arguments": {
              "idOrName": os.environ["VERCEL_PROJECT_ID"],
              "decrypt": "false"
            }
          }, separators=(',',':')))
          PY
          )"
          api_key_header="$(printf '%s: %s' 'x-api-key' "$COMPOSIO_API_KEY")"
          code="$(curl --silent --show-error --max-time 30 -o /tmp/composio-check.json -w '%{http_code}' \
            -H "$api_key_header" \
            -H 'Content-Type: application/json' \
            --data "$body" \
            'https://backend.composio.dev/api/v3/tools/execute/VERCEL_FILTER_PROJECT_ENVS')"
          rm -f /tmp/composio-check.json
          unset COMPOSIO_API_KEY api_key_header body
          case "$code" in
            200) echo 'Composio Vercel metadata route is reachable with decrypt=false; no Vercel value was decrypted, changed, or emitted.' ;;
            *) echo "Composio bridge verification failed with HTTP $code" >&2; exit 1 ;;
          esac
