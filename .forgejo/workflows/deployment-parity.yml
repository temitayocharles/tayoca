name: Tayoca deployment parity

on:
  workflow_dispatch:
  schedule:
    - cron: "30 19 * * *"

permissions:
  contents: read

concurrency:
  group: tayoca-deployment-parity
  cancel-in-progress: true

jobs:
  verify:
    name: Verify production matches canonical Forgejo
    runs-on: forgejo-general
    timeout-minutes: 15
    steps:
      - name: Check out Tayoca canonical source
        uses: https://data.forgejo.org/actions/checkout@v6

      - name: Verify deployed HTML byte parity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_production_parity.py \
            --base-url https://tayoca.com/ \
            --json-output deployment-parity.json
