name: Tayoca Cal webhook secret bootstrap

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bootstrap an encrypted handoff or finalize a registered webhook set
        required: true
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - finalize
      request_id:
        description: Non-secret idempotency key
        required: true
        type: string
      recipient_public_key_b64:
        description: Base64-encoded PEM RSA public key; required only for bootstrap
        required: false
        type: string
      webhook_ids_b64:
        description: Base64-encoded JSON array of registered Cal webhook IDs; finalize only
        required: false
        type: string

enable-openid-connect: true

permissions:
  contents: write

concurrency:
  group: tayoca-cal-webhook-secret-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: ${{ inputs.mode == 'bootstrap' }}
    runs-on: forgejo-general
    timeout-minutes: 10
    env:
      VAULT_ADDR: https://vault.tca-infraforge.site
      VAULT_ROLE: tayoca-cal-webhook-bootstrap
      VAULT_AUDIENCE: vault://tayoca/cal-webhook-bootstrap
      VAULT_PATH: temitayo/staging/platform-tools/n8n/tayoca-cal-webhook
      REQUEST_ID: ${{ inputs.request_id }}
      RECIPIENT_PUBLIC_KEY_B64: ${{ inputs.recipient_public_key_b64 }}
    steps:
      - name: Check out canonical main
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Generate or reuse secret and publish ciphertext-only handoff
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          case "$REQUEST_ID" in
            *[!a-zA-Z0-9._-]*|'') echo 'Invalid request_id' >&2; exit 1 ;;
          esac
          if [ "${#REQUEST_ID}" -lt 12 ] || [ "${#REQUEST_ID}" -gt 80 ]; then
            echo 'request_id length out of bounds' >&2
            exit 1
          fi
          test -n "$RECIPIENT_PUBLIC_KEY_B64"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"

          tmp="$(mktemp -d)"
          cleanup() {
            unset FORGEJO_ID_TOKEN VAULT_TOKEN CAL_WEBHOOK_SECRET RECIPIENT_PUBLIC_KEY_B64
            rm -rf "$tmp"
          }
          trap cleanup EXIT

          case "$ACTIONS_ID_TOKEN_REQUEST_URL" in
            https://forgejo.tca-infraforge.site/*) ;;
            *) echo 'Unexpected Forgejo OIDC request origin' >&2; exit 1 ;;
          esac
          oidc_path="${ACTIONS_ID_TOKEN_REQUEST_URL#https://forgejo.tca-infraforge.site}"
          oidc_response="$(curl --fail --silent --show-error --max-time 30 \
            -H 'Host: forgejo.tca-infraforge.site' \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "http://forgejo-http.forgejo.svc.cluster.local:3000$oidc_path&audience=$VAULT_AUDIENCE")"
          FORGEJO_ID_TOKEN="$(printf '%s' "$oidc_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          test -n "$FORGEJO_ID_TOKEN"
          echo "::add-mask::$FORGEJO_ID_TOKEN"
          export FORGEJO_ID_TOKEN
          unset oidc_response oidc_path

          vault_login_body="$(python3 - <<'PY'
          import json, os
          print(json.dumps({"role": os.environ["VAULT_ROLE"], "jwt": os.environ["FORGEJO_ID_TOKEN"]}))
          PY
          )"
          vault_login_response="$(curl --fail --silent --show-error --max-time 30 \
            -H 'Content-Type: application/json' \
            --data "$vault_login_body" \
            "$VAULT_ADDR/v1/auth/forgejo-actions/login")"
          VAULT_TOKEN="$(printf '%s' "$vault_login_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["auth"]["client_token"])')"
          test -n "$VAULT_TOKEN"
          echo "::add-mask::$VAULT_TOKEN"
          export VAULT_TOKEN
          unset vault_login_body vault_login_response FORGEJO_ID_TOKEN

          existing_file="$tmp/existing.json"
          existing_status="$(curl --silent --show-error --max-time 30 \
            -o "$existing_file" -w '%{http_code}' \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            "$VAULT_ADDR/v1/kv/data/$VAULT_PATH")"

          if [ "$existing_status" = 200 ]; then
            eval "$(python3 - "$existing_file" "$REQUEST_ID" <<'PY'
          import json, shlex, sys
          body=json.load(open(sys.argv[1]))
          values=((body.get('data') or {}).get('data') or {})
          req=values.get('request_id') or ''
          state=values.get('state') or ''
          secret=values.get('CAL_WEBHOOK_SECRET') or ''
          if not secret:
              raise SystemExit('existing Vault record is missing CAL_WEBHOOK_SECRET')
          if req != sys.argv[2]:
              raise SystemExit('existing Vault record belongs to a different request_id; refusing rotation')
          if state not in ('pending_cal_registration','active'):
              raise SystemExit('existing Vault record has unexpected state')
          print('CAL_WEBHOOK_SECRET=' + shlex.quote(secret))
          print('RECORD_STATE=' + shlex.quote(state))
          PY
          )"
          elif [ "$existing_status" = 404 ]; then
            CAL_WEBHOOK_SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
            RECORD_STATE='pending_cal_registration'
            echo "::add-mask::$CAL_WEBHOOK_SECRET"
            export CAL_WEBHOOK_SECRET RECORD_STATE
            created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            export created_at
            python3 - "$tmp/vault-write.json" <<'PY'
          import json, os, sys
          payload={"data":{
              "CAL_WEBHOOK_SECRET": os.environ["CAL_WEBHOOK_SECRET"],
              "request_id": os.environ["REQUEST_ID"],
              "state": "pending_cal_registration",
              "created_at": os.environ["created_at"],
          }}
          with open(sys.argv[1], 'w') as f:
              json.dump(payload, f, separators=(',',':'))
          PY
            curl --fail --silent --show-error --max-time 30 \
              -H "X-Vault-Token: $VAULT_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary "@$tmp/vault-write.json" \
              "$VAULT_ADDR/v1/kv/data/$VAULT_PATH" >/dev/null
          else
            echo "Unexpected Vault read status: $existing_status" >&2
            exit 1
          fi
          echo "::add-mask::$CAL_WEBHOOK_SECRET"
          export CAL_WEBHOOK_SECRET RECORD_STATE
          rm -f "$existing_file" "$tmp/vault-write.json"
          unset VAULT_TOKEN

          printf '%s' "$RECIPIENT_PUBLIC_KEY_B64" | base64 -d > "$tmp/recipient.pem"
          openssl pkey -pubin -in "$tmp/recipient.pem" -noout >/dev/null
          key_bits="$(openssl pkey -pubin -in "$tmp/recipient.pem" -text -noout | sed -n 's/.*Public-Key: (\([0-9][0-9]*\) bit).*/\1/p' | head -n1)"
          if [ -z "$key_bits" ] || [ "$key_bits" -lt 2048 ]; then
            echo 'Recipient RSA key must be at least 2048 bits' >&2
            exit 1
          fi
          printf '%s' "$CAL_WEBHOOK_SECRET" > "$tmp/plaintext"
          openssl pkeyutl -encrypt -pubin -inkey "$tmp/recipient.pem" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in "$tmp/plaintext" -out "$tmp/ciphertext"
          secret_sha256="$(printf '%s' "$CAL_WEBHOOK_SECRET" | sha256sum | awk '{print $1}')"
          recipient_fingerprint="$(openssl pkey -pubin -in "$tmp/recipient.pem" -outform DER | sha256sum | awk '{print $1}')"
          ciphertext_b64="$(base64 -w0 "$tmp/ciphertext")"
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          canonical_sha="$(git rev-parse HEAD)"
          export secret_sha256 recipient_fingerprint ciphertext_b64 generated_at canonical_sha

          handoff_branch="handoff/cal-webhook-$REQUEST_ID"
          envelope_rel="handoff/cal-webhook-$REQUEST_ID.json"
          if git ls-remote --exit-code origin "refs/heads/$handoff_branch" >/dev/null 2>&1; then
            echo "Encrypted handoff branch already exists for request_id=$REQUEST_ID; refusing ambiguous republish" >&2
            exit 1
          fi
          python3 - "$tmp/envelope.json" <<'PY'
          import json, os, sys
          envelope={
              "schema":"tayoca.cal-webhook-encrypted-handoff.v1",
              "request_id":os.environ["REQUEST_ID"],
              "state":os.environ["RECORD_STATE"],
              "cipher":"RSA-OAEP-SHA256",
              "ciphertext_b64":os.environ["ciphertext_b64"],
              "secret_sha256":os.environ["secret_sha256"],
              "recipient_public_key_sha256":os.environ["recipient_fingerprint"],
              "forgejo_canonical_sha":os.environ["canonical_sha"],
              "generated_at":os.environ["generated_at"],
          }
          with open(sys.argv[1], 'w') as f:
              json.dump(envelope, f, indent=2, sort_keys=True)
              f.write('\n')
          PY

          git config user.name 'Tayoca Cal Bootstrap'
          git config user.email 'tayoca-cal-bootstrap@users.noreply.forgejo.tca-infraforge.site'
          git switch -c "$handoff_branch"
          mkdir -p handoff
          cp "$tmp/envelope.json" "$envelope_rel"
          git add "$envelope_rel"
          git commit -m "handoff(cal): publish encrypted webhook secret envelope" >/dev/null
          git push --quiet origin "HEAD:refs/heads/$handoff_branch"

          echo "Encrypted handoff published on branch $handoff_branch; request_id=$REQUEST_ID; secret_sha256=$secret_sha256"

  finalize:
    if: ${{ inputs.mode == 'finalize' }}
    runs-on: forgejo-general
    timeout-minutes: 8
    env:
      VAULT_ADDR: https://vault.tca-infraforge.site
      VAULT_ROLE: tayoca-cal-webhook-bootstrap
      VAULT_AUDIENCE: vault://tayoca/cal-webhook-bootstrap
      VAULT_PATH: temitayo/staging/platform-tools/n8n/tayoca-cal-webhook
      REQUEST_ID: ${{ inputs.request_id }}
      WEBHOOK_IDS_B64: ${{ inputs.webhook_ids_b64 }}
    steps:
      - name: Mark registered webhook set active without exposing the secret
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          case "$REQUEST_ID" in
            *[!a-zA-Z0-9._-]*|'') echo 'Invalid request_id' >&2; exit 1 ;;
          esac
          test -n "$WEBHOOK_IDS_B64"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          tmp="$(mktemp -d)"
          cleanup() { unset FORGEJO_ID_TOKEN VAULT_TOKEN CAL_WEBHOOK_SECRET; rm -rf "$tmp"; }
          trap cleanup EXIT

          case "$ACTIONS_ID_TOKEN_REQUEST_URL" in
            https://forgejo.tca-infraforge.site/*) ;;
            *) echo 'Unexpected Forgejo OIDC request origin' >&2; exit 1 ;;
          esac
          oidc_path="${ACTIONS_ID_TOKEN_REQUEST_URL#https://forgejo.tca-infraforge.site}"
          oidc_response="$(curl --fail --silent --show-error --max-time 30 \
            -H 'Host: forgejo.tca-infraforge.site' \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "http://forgejo-http.forgejo.svc.cluster.local:3000$oidc_path&audience=$VAULT_AUDIENCE")"
          FORGEJO_ID_TOKEN="$(printf '%s' "$oidc_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          export FORGEJO_ID_TOKEN
          echo "::add-mask::$FORGEJO_ID_TOKEN"
          unset oidc_response oidc_path

          vault_login_body="$(python3 - <<'PY'
          import json, os
          print(json.dumps({"role": os.environ["VAULT_ROLE"], "jwt": os.environ["FORGEJO_ID_TOKEN"]}))
          PY
          )"
          vault_login_response="$(curl --fail --silent --show-error --max-time 30 \
            -H 'Content-Type: application/json' --data "$vault_login_body" \
            "$VAULT_ADDR/v1/auth/forgejo-actions/login")"
          VAULT_TOKEN="$(printf '%s' "$vault_login_response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["auth"]["client_token"])')"
          export VAULT_TOKEN
          echo "::add-mask::$VAULT_TOKEN"
          unset vault_login_body vault_login_response FORGEJO_ID_TOKEN

          curl --fail --silent --show-error --max-time 30 \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            "$VAULT_ADDR/v1/kv/data/$VAULT_PATH" > "$tmp/current.json"
          printf '%s' "$WEBHOOK_IDS_B64" | base64 -d > "$tmp/webhook-ids.json"
          activated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export activated_at
          python3 - "$tmp/current.json" "$tmp/webhook-ids.json" "$tmp/final.json" <<'PY'
          import json, os, sys
          body=json.load(open(sys.argv[1]))
          values=((body.get('data') or {}).get('data') or {})
          if values.get('request_id') != os.environ['REQUEST_ID']:
              raise SystemExit('request_id does not match Vault record')
          secret=values.get('CAL_WEBHOOK_SECRET') or ''
          if not secret:
              raise SystemExit('Vault record missing CAL_WEBHOOK_SECRET')
          ids=json.load(open(sys.argv[2]))
          if not isinstance(ids,list) or not ids or not all(isinstance(x,str) and x for x in ids):
              raise SystemExit('webhook_ids must be a non-empty JSON string array')
          payload={"data":dict(values)}
          payload['data'].update({"state":"active","activated_at":os.environ['activated_at'],"webhook_ids":ids})
          with open(sys.argv[3], 'w') as f:
              json.dump(payload,f,separators=(',',':'))
          PY
          curl --fail --silent --show-error --max-time 30 \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "@$tmp/final.json" \
            "$VAULT_ADDR/v1/kv/data/$VAULT_PATH" >/dev/null
          unset VAULT_TOKEN
          echo "Cal webhook Vault record finalized for request_id=$REQUEST_ID; no secret value emitted."
