browser_certification:
  status: PASS
  runtime: "Chromium 144 via Playwright Page.setContent"
  required_events: 8
  missing_ga_style_events: 0
  missing_first_party_events: 0
  critical_payloads: 17
  critical_payloads_with_test_marker: 17
  blocked_production_posts: 0
  pii_event_property_keys: 0
  newsletter_lineage_proved: true
  case_study_assist_proved: true
  production_test_form_writes: 0
  production_test_analytics_rows: 0
  synthetic_purchase: false
  synthetic_revenue: false
  synthetic_review: false
  infrastructure_note: "Three Browserless credentials returned 401, Cloudflare Browser Rendering returned an upstream authentication error, and local managed Chromium blocks navigable URLs through URLBlocklist policy. The certification therefore used Chromium document injection with byte-identical production scripts and isolated production-location context."

fail_closed_controls:
  - "No PII is sent to GA4 or the first-party analytics collector."
  - "Stage 12 browser certification does not submit production assessment, newsletter or purchase records."
  - "A missing Google metric is reported as unavailable/stale, not fabricated as zero."
  - "The duplicate empty Tayoca GA4 property is not merged, deleted or treated as authoritative without a separate governance decision."
  - "Stage 7 private-source and Stage 8 publication firewalls remain binding."
  - "Stage 11 verified-revenue authority remains binding."

gate:
  requirement: "test traffic proves each critical event and report"
  baseline: docs/stage12-executive-analytics-baseline.json
  required_evidence:
    - ga4_property_and_stream_verified
    - search_console_owner_verified
    - sitemap_verified
    - critical_browser_event_emission
    - newsletter_attribution_emission
    - case_study_assist_emission
    - no_production_test_form_writes
    - executive_report_test
    - production_dashboard_readback
    - rollback_reference
  passed: true
