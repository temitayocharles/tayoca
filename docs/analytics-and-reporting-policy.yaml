schema_version: 1
stage: 12
stage_name: analytics_and_executive_reporting
status: GREEN
purpose: "Prove Tayoca's critical acquisition, conversion, attribution and executive-reporting events without inventing traffic or mixing test evidence into production metrics."

canonical_systems:
  repository:
    host: forgejo.tca-infraforge.site
    repo: temitayocharles/tayoca
    authority: primary
  ga4:
    account: accounts/352773461
    property: properties/548373018
    property_name: Tayoca
    stream: properties/548373018/dataStreams/15375937707
    stream_name: Tayoca Website
    measurement_id: G-G4QC90QNXW
    default_uri: https://tayoca.com
    verified_via_admin_api: true
    non_authoritative_duplicate_property: properties/548376430
    duplicate_property_stream_count: 0
  search_console:
    property: https://tayoca.com/
    permission_level: siteOwner
    verified_via_api: true
    sitemap: https://tayoca.com/sitemap.xml
    snapshot: public/data/search-console-summary.json
  first_party_analytics:
    collector: https://v7mhrspk.function2.insforge.app/analytics-event
    dashboard: https://v7mhrspk.function2.insforge.app/analytics-dashboard/overview
    table: analytics_events
  executive_reporting:
    workflow_id: MRaoY2aHm85q3QWG
    workflow_name: Tayoca Growth OS | Demand Engine & Revenue Command Center
    cadence: weekly_friday

privacy:
  prohibited_event_data:
    - email
    - buyer_email
    - purchase_email
    - review_token
    - authentication_token
    - raw_ip
  url_sanitization:
    remove_query_keys: [token, sale_id, email, purchase_email, buyer_email, review_token]
    remove_hash: true
  visitor_identity: "First-party collector uses an irreversible server-side visitor hash; browser code does not persist raw IP or user-agent."

measurement_contract:
  browser_authority: public/ga4.js
  browser_authority_blob: 3fbbbbbd0e278e4afd518dbe8b46477c0a008294
  growth_interaction_owner: public/growth-os.js
  growth_interaction_blob: 9b049540f111e61aef0d17e67dfbf682def557fb
  compatibility_adapter: public/revenue-events.js
  compatibility_adapter_blob: 84850eba4661b26b0cdffa483fbd619e2768bffb
  contract_version: stage12-v1
  critical_events:
    - page_view
    - assessment_cta_click
    - generate_lead
    - assessment_schedule_click
    - operator_brief_signup
    - product_click
    - newsletter_attributed_conversion
    - case_study_assisted_conversion
  governance_events:
    - operator_brief_unsubscribe
    - contact_click
    - outbound_click
    - gumroad_click
    - whatsapp_click
  verified_commercial_event:
    name: purchase
    authority: "Provider-verified revenue evidence from the Stage 11 commercial system; browser test traffic must never synthesize a purchase."

conversion_definition:
  generate_lead: "A successful assessment request or explicitly consented Operator Brief signup. An unsubscribe is not a lead."
  assessment_schedule_click: "A click on the scheduling action returned after an accepted assessment request."
  operator_brief_signup: "An explicitly consented Operator Brief signup accepted by the intake workflow."
  product_click: "A click from Tayoca to a Gumroad product destination."
  newsletter_attributed_conversion: "A downstream conversion whose session attribution contains Operator Brief/email UTM lineage."
  case_study_assisted_conversion: "A downstream conversion in a session that previously visited the governed Results surface."

attribution:
  first_touch: "Persist the first non-PII source/medium/campaign/referrer context for the browser session."
  last_touch: "Update with later explicit UTM/referrer context without erasing first touch."
  newsletter:
    source: operator_brief
    medium: email
    issue_key: utm_campaign
    section_key: utm_content
    rule: "Operator Brief links use source=operator_brief and medium=email. The issue and section remain explicit UTM lineage, not inferred from identity."
  case_study:
    governed_assist_surface: /results.html
    rule: "A Results-page visit can assist a later conversion in the same browser session. Withdrawn/unverified historical claims are never promoted into attribution metadata."

search_console:
  sitemap:
    submitted_urls: 33
    errors: 0
    warnings: 0
    pending: false
  final_data_through: '2026-08-08'
  seven_day:
    clicks: 0
    impressions: 12
    ctr: 0
    average_position: 24.166666666666668
  reporting_rule: "Period totals are authoritative. Query/page breakdown rows may omit anonymized data or use different aggregation semantics and must not be summed to reconstruct totals."
  sitemap_index_note: "A zero indexed count in sitemap metadata is not treated as proof of non-indexing because Search Analytics already reports impressions for Tayoca URLs."

ga4_baseline:
  observed_30d_events:
    page_view: 28
    first_visit: 22
    session_start: 22
    scroll: 6
    user_engagement: 3
    form_start: 1
  current_key_events:
    - purchase
  key_event_api_constraint: "The connected Google Analytics Admin tooling is read-only for key-event definitions. Stage 12 tests event emission and reporting without claiming that newly instrumented events are already marked as GA4 key events."

test_traffic:
  query_marker: tayoca_test=stage12
  form_rule: "In Stage 12 test mode, growth forms simulate accepted responses locally and never call the production intake webhooks."
  browser_rule: "Certification executes exact hash-verified production JavaScript unchanged in Chromium with Tayoca production location/session context and replaces fetch before script execution; no certification request leaves the browser."
  production_metric_rule: "Do not create fake leads, subscriptions, purchases, reviews, revenue or persistent first-party analytics rows for certification."
  purchase_rule: "Never synthesize purchase test traffic."

executive_reporting:
  search_snapshot_url: https://tayoca.com/data/search-console-summary.json
  search_freshness_rule: "Always display the Search Console data-through date. Never convert unavailable/stale search data into a numeric zero without provenance."
  first_party_rule: "Use Tayoca first-party analytics for live site activity and use verified Google snapshots/APIs for Google-owned metrics."
  commercial_rule: "Revenue, proposal and pipeline values remain governed by Stage 11 ledgers and verified revenue evidence."
  active_workflow_version: b159ae03-5ea7-48f2-af46-e5794c0d4182
  rollback_workflow_version: 8b63948a-5daf-4c8c-993e-d620b657b39b
  certification_execution: '70676'

production_certification:
  github_source_commit: cbd43bd36917b80be000e8aaf88a8a6f515ee318
  vercel_deployment: dpl_DyKRko9NRqLmVXcEbhUmd1rTE39V
  vercel_state: READY
  vercel_ready_substate: PROMOTED
  deployment_checks: 0
