  - claim_id: VERIFIED_BUYER_REVIEW_PIPELINE
    claim_type: policy
    normalized_claim: "Reviews displayed as verified buyer reviews are purchase-verified, buyer-email matched, consented, privacy-sanitized, and human-approved."
    surfaces:
      - public/reviews.html
      - public/trust.html
    source_class: first_party_operational
    evidence_refs:
      - "n8n:ZZDXWFKiPnzeKtNr"
      - docs/evidence-policy.md
    disclosure_class: public
    approval_state: conditional
    public_surface_status: active_scoped
    controls_observed:
      - "Server-side Gumroad sale-detail API verification using the configured Gumroad access token."
      - "Exact requested sale ID must match the provider-returned sale."
      - "Allowed-product list is enforced."
      - "Refund/dispute/chargeback and buyer contact-eligibility checks are enforced."
      - "Submitted buyer email must match the verified purchase record."
      - "Explicit publication consent is required."
      - "Human Slack publication approval is required."
      - "Public feed requires published + consent + verified_buyer."
      - "Public feed strips buyer email and payment fields."
      - "Critical sentiment alone is not a moderation rejection criterion."
    limitations:
      - "Sale-ingestion webhook itself has no provider-authenticated ingress; server-side provider lookup is the compensating verification control."
      - "Review invitation token is deterministically derived from the sale ID and is an outstanding hardening item; the buyer-email match and authoritative purchase lookup remain required before verified_buyer=true."
      - "Do not describe the review flywheel as fully hardened or claim webhook authentication that does not exist."
    conditions: "The public 'verified buyer' label is approved only for rows that satisfy the currently observed provider verification, buyer-email match, explicit consent, human approval, and public-feed filters. Any change that removes one of those controls invalidates this conditional approval until re-reviewed."
    correction_path: "Disable affected public review output, move the claim to pending/blocked, and correct public wording if the control chain changes."
    gate_blocker: false

