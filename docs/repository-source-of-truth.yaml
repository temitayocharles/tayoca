fail_closed_rules:
  - id: PRIVATE_NOT_PUBLISHABLE
    rule: "Private repositories are not publishable and are not eligible for public Tayoca disclosure by default."
  - id: MIRROR_EXACT_ORIGIN
    rule: "A Forgejo repository with mirror=true and a same-name GitHub original_url is classified as GitHub-source / Forgejo-mirror unless an explicit canonical override exists."
  - id: FORGEJO_CANONICAL_OVERRIDE
    rule: "Explicit repository metadata declaring Forgejo canonical, desired-state, permanent CI authority, or canonical source overrides the generic mirror rule."
  - id: AMBIGUOUS_AUTHORITY_EXCLUDED
    rule: "Shared non-mirror repositories without an explicit authority declaration remain excluded from Tayoca ingestion until authority is explicitly classified."
  - id: BACKUP_TEST_LEGACY_EXCLUDED
    rule: "Backup, precutover, recovery, CI-validation, rename-alias, and orphaned-mirror repositories are excluded from active Tayoca sources."
  - id: ARCHIVED_EXCLUDED
    rule: "Archived repositories are excluded from active Tayoca sources unless explicitly promoted."
  - id: PLATFORM_ONLY_PENDING
    rule: "A repository present on only one platform remains excluded from Tayoca ingestion until its source authority and intended lifecycle are explicitly classified."
  - id: PUBLIC_IS_NOT_APPROVAL
    rule: "Public repository visibility alone does not authorize Tayoca publication, reuse, or external disclosure."
  - id: NO_SILENT_OMISSION
    rule: "Inventory or reconciliation is invalid if pagination is not exhausted or if a platform inventory cannot be completed."

