name: Tayoca Production Growth Cycle 1
status: LOCKED_ACTIVE
effective_date: '2026-08-10'
timezone: America/Toronto

purpose: >
  Operate the certified Tayoca platform as a customer-acquisition and revenue-producing
  business. Prioritize measurable commercial outcomes over additional feature construction.

authority:
  canonical_host: forgejo.tca-infraforge.site
  canonical_repository: temitayocharles/tayoca
