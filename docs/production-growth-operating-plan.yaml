  secondary_role: deployment_mirror_only
  certified_baseline:
    commit: 2f98c1f6899425437e185b791512d7b35252d838
    release_tag: tayoca-certified-2026-08-10
    stage14_baseline: docs/stage14-final-certification-baseline.json
    canonical_pages: 34
    violations: 0

operating_rules:
  - Read this plan before starting or resuming post-certification Tayoca work.
  - Continue the highest-priority incomplete workstream whose dependencies are satisfied.
  - Do not start unrelated or convenience-driven feature work outside this plan.
  - Patch or extend existing application, workflow, analytics, editorial, and revenue layers before creating parallel systems.
  - Forgejo is canonical; GitHub is deployment mirror only.
  - Preserve rollback references, workflow history, evidence baselines, sanitized backups, and audit artifacts.
  - Do not weaken claim integrity, private-source, human-publication, revenue-verification, analytics-provenance, or recovery controls.
  - Missing or stale measurements must be disclosed rather than silently converted to zero.
  - Paid media remains zero by default unless a bounded experiment is explicitly approved.
  - Optimize for qualified commercial movement and verified revenue, not traffic alone.

locked_cross_stage_controls:
  claim_integrity: binding
  private_source_firewall: binding
  human_publication_approval: binding
  verified_revenue_authority: binding
  analytics_provenance: binding
  workflow_recovery: binding
  first_party_measurement_authority: binding
  forgejo_source_of_truth: binding
  zero_default_paid_media_spend: binding

cycle:
  horizon_days: 30
  phase: CONTROLLED_EXPERIMENTS
  objective: >
    Prove that Tayoca can repeatedly convert qualified attention into commercial intent,
    leads, opportunities, conversations, proposals, and verified revenue using the certified platform.
  primary_funnel:
    - qualified_attention
    - assessment_or_product_intent
    - lead
    - opportunity
    - conversation
    - proposal
    - verified_revenue

