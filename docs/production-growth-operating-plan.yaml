  - id: assistive_technology_audit
    severity: medium
    blocking_scope: manual_screen_reader_validation
    status: AUTOMATED_BROWSER_VERIFIED_MANUAL_ASSISTIVE_TECHNOLOGY_PENDING
    automated_browser_verified_at: '2026-08-17T20:40:02.204Z'
    evidence: docs/w10-selfhosted-browser-accessibility-remediation-2026-08-17.json
    regression_workflow: .forgejo/workflows/selfhosted-accessibility-audit.yml
    rule: >
      Self-hosted Chromium/Axe plus keyboard validation passes the representative 5-page desktop/mobile matrix.
      Do not claim full WCAG certification until manual screen-reader and broader assistive-technology testing is completed;
      VoiceOver plus an appropriate Windows screen-reader environment remain explicit manual activities.
  - id: search_console_sitemap_processing_lag
    severity: low
    blocking_scope: none
    rule: Preserve observed Search Console metadata until Google reprocesses the canonical sitemap.
  - id: native_n8n_errorworkflow_dispatch
    severity: resolved
    blocking_scope: none
    resolved_at: '2026-08-17T15:46:34.583Z'
    rule: >
      A controlled automatic webhook-mode failure (execution 88875) triggered the native n8n Error Trigger and emitted only a sanitized diagnostic marker.
      Manual executions are not valid native Error Trigger certification. The five-minute metadata-only failure monitor remains active as defense in depth.
  - id: revenue_command_center_placeholder_metrics
    severity: resolved
    blocking_scope: none
    resolved_at: '2026-08-17T13:50:59Z'
    rule: >
      The existing Revenue Command Center is certified provenance-safe: missing values remain null/unavailable,
      genuine measured zeros remain zero, pageviews are not mislabeled as sessions, and ROAS is unavailable when spend is zero.
  - id: cal_booking_pipeline_sync
    severity: medium
    blocking_scope: automatic_booking_reconciliation
    status: BLOCKED_RUNTIME_CREDENTIAL_INVALID
    observed_at: '2026-08-17T16:03:49.408Z'
    authority:
      provider: Cal.com
      connected_account: cal_batak-modal
      username: tayoca
      event_types:
        platform_engineering_consultation: 6432034
        finops_audit: 6432033
      current_booking_count: 0
      revenue_pipeline_data_rows: 0
    runtime_probe:
      n8n_execution: '88971'
      composio_endpoint: /api/v3.1/tools/execute/CAL_FETCH_ALL_BOOKINGS
      http_status: 401
      provider_error_code: '801'
      api_key_present_in_process: true
      api_key_valid_for_tool_execution: false
      secret_value_persisted: false
      probe_workflows_archived: true
      diagnostic_row_deleted: true
    rule: >
      Keep booking reconciliation operator-controlled until the Vault-mounted COMPOSIO_API_KEY is rotated to a valid
      Composio project key and the authenticated Cal read is recertified from inside n8n. Only provider-confirmed bookings
      may advance an existing Revenue Pipeline opportunity; correlate by attendee email plus assessment/event type and retain
      the Cal booking UID as provider evidence. Never infer assessment_scheduled from a CTA click or presumed booking.
  - id: n8n_resend_runtime_credential
    severity: resolved
    blocking_scope: none
    resolved_at: '2026-08-17T13:30:41Z'
    rule: >
      Production n8n projects RESEND_API_KEY and COMPOSIO_API_KEY through the Vault-backed n8n-runtime-vault-shadow without
      storing secret values in workflow JSON or source control. Projection/presence is certified; the separate Cal booking
      item records that the currently mounted Composio key fails API execution and must not be treated as validity proof.

change_control:
  plan_revision_required_when:
    - adding_or_removing_a_priority_campaign
    - changing_the_primary_funnel
    - creating_a_new_commercial_entry_path
    - introducing_a_new_core_platform_or_parallel_stack
    - changing_a_locked_cross_stage_control
    - changing_the_cycle_success_gate
  revision_method: >
    Modify this canonical file through a normal Forgejo commit, pass existing quality gates, and mirror
    the exact change to GitHub. Do not rewrite historical certified baselines.
  runtime_rule: A plan/documentation revision by itself must not mutate production runtime.

resume_protocol:
  on_continue_or_go:
    - Read this file and latest workstream statuses first.
    - Confirm no critical/high regression.
    - Continue the highest-priority incomplete workstream whose dependencies are satisfied.
    - If a workstream is WAITING_HUMAN_APPROVAL, inspect the recorded approval execution before starting any new work.
    - Do not restart completed stages 0-14 unless a verified regression requires it.
    - Do not create an unrelated workstream silently.

cycle_start_gate:
  passed: true

cycle_success_gate:
  requirement: >
    Production evidence demonstrates complete commercial lineage from qualified attention through
    intent, lead, opportunity, conversation, proposal, and verified revenue, with defensible
    conversion baselines that identify what to scale, change, or stop.
  passed: false
