### Netlify Configuration

# Build settings
build = "public"

# Redirects for playbook landing pages
[[redirects]]
  from = "/l/aws-finops-playbook/*"
  to = "/l/aws-finops-playbook/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/l/platform-engineering-playbook/*"
  to = "/l/platform-engineering-playbook/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/l/finops-ops-playbook/*"
  to = "/l/finops-ops-playbook/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/l/data-pipelines-playbook/*"
  to = "/l/data-pipelines-playbook/index.html"
  status = 200
  force = false

